<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指導記録アーカイブ - 異年同日比較</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* オーディオビジュアライザー用キャンバス */
        #visualizer { width: 100%; height: 60px; background-color: #0f172a; border-radius: 0.375rem; }
        /* テキスト2行制限用 */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-slate-800 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <h1 class="text-xl font-bold tracking-wide">指導記録アーカイブ</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-open-backup" class="text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-md transition flex items-center gap-1.5 border border-slate-600">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    データ管理
                </button>
                <div class="text-sm text-slate-300 flex items-center gap-1">
                    <span>総記録数:</span>
                    <span id="total-records-count" class="font-bold text-white text-lg">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左カラム: カレンダー & 記録フォーム -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- カレンダーカード -->
            <section class="bg-white rounded-md shadow-sm border border-slate-200 p-4">
                <div class="flex justify-between items-center mb-4">
                    <button id="cal-prev" class="p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-md transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 id="cal-month-year" class="text-lg font-bold text-slate-700">2026年9月</h2>
                    <button id="cal-next" class="p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-md transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-2">
                    <div class="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-500">土</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                    <!-- JSでカレンダー生成 -->
                </div>
                <div class="mt-4 text-center">
                    <button id="btn-today" class="text-sm text-blue-600 hover:text-blue-800 font-medium">今日に戻る</button>
                </div>
            </section>

            <section id="recorder-card" class="bg-white rounded-md shadow-sm border border-slate-200 overflow-hidden hidden transition-all duration-300">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h3 id="recorder-title" class="font-bold text-slate-700 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        新規記録作成
                    </h3>
                    <button id="btn-close-recorder" class="text-slate-400 hover:text-slate-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="p-4 space-y-4">
                    <!-- タイトル（概要）入力 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">概要・タイトル (必須)</label>
                        <input type="text" id="entry-title" placeholder="例: 秋季県大会 vs〇〇高校、シート打撃など" class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <!-- 本文（詳細）入力 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">詳細内容・指導メモ</label>
                        <textarea id="entry-text" rows="4" placeholder="・ピッチャーの立ち上がりに課題&#10;・サインミスの修正が必要&#10;※マイクで音声入力も可能です" class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"></textarea>
                    </div>

                    <!-- 音声録音エリア -->
                    <div class="bg-slate-50 border border-slate-200 rounded-md p-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-500 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                                音声メモ (自動文字起こし対応)
                            </span>
                            <span id="timer-display" class="font-mono text-sm text-slate-600">00:00</span>
                        </div>
                        
                        <canvas id="visualizer" class="hidden mb-3"></canvas>
                        
                        <div class="flex items-center gap-3">
                            <button id="btn-record-toggle" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-md font-bold text-sm flex items-center justify-center gap-2 transition">
                                <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse hidden" id="recording-indicator"></span>
                                <span id="record-btn-text">録音開始</span>
                            </button>
                        </div>
                        <p id="recording-status" class="text-[11px] text-slate-500 mt-2 text-center">録音を開始すると、自動的にテキストも入力されます</p>
                    </div>

                    <button id="btn-save-entry" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md transition flex items-center justify-center gap-2 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                        この記録を保存する
                    </button>
                </div>
            </section>
        </div>

        <!-- 右カラム: 異年同日のタイムライン表示 -->
        <div class="lg:col-span-7 flex flex-col h-full">
            <div class="bg-white rounded-md shadow-sm border border-slate-200 p-4 mb-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="timeline-date-title">9月22日の記録</span>
                </h2>
                <button id="btn-open-recorder" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-md text-sm font-bold transition flex items-center gap-1 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    記録追加
                </button>
            </div>

            <!-- タイムラインコンテナ -->
            <div id="timeline-container" class="space-y-4 pb-10">
                <!-- JSで動的に表示 -->
            </div>
        </div>
    </main>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div id="delete-modal-content" class="bg-white rounded-md shadow-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200 p-5">
            <h3 class="text-lg font-bold text-slate-800 mb-2">記録を削除しますか？</h3>
            <p class="text-sm text-slate-600 mb-6">この操作は取り消せません。本当にこの記録を削除してもよろしいですか？</p>
            <div class="flex justify-end gap-3">
                <button id="btn-cancel-delete" class="px-4 py-2 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md transition">キャンセル</button>
                <button id="btn-confirm-delete" class="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-md transition shadow-sm">削除する</button>
            </div>
        </div>
    </div>

    <!-- データ管理（バックアップ・復元）モーダル -->
    <div id="backup-modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div id="backup-modal-content" class="bg-white rounded-md shadow-xl max-w-lg w-full mx-4 transform scale-95 transition-transform duration-200 p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    データのバックアップと復元
                </h3>
                <button id="btn-close-backup" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- エクスポート -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">1. バックアップを出力</h4>
                <p class="text-xs text-slate-600 leading-relaxed">現在の全指導記録をデータファイルまたはテキストとして保存します。</p>
                <div class="flex flex-wrap gap-2 pt-1">
                    <button id="btn-export-file" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ファイルで出力 (.json)
                    </button>
                    <button id="btn-copy-json" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-2 rounded-md text-xs font-bold transition flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        テキストをコピー
                    </button>
                </div>
            </div>

            <hr class="border-slate-200">

            <!-- インポート -->
            <div class="space-y-3">
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. データを復元（読み込み）</h4>
                <p class="text-xs text-slate-600 leading-relaxed">保存したバックアップファイル、またはコピーしたテキストを貼り付けて読み込みます。</p>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">ファイルから読み込み</label>
                    <input type="file" id="backup-file-input" accept=".json,.txt" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">または バックアップテキストを貼り付け</label>
                    <textarea id="import-text-input" rows="3" placeholder='ここにバックアップテキストを貼り付けます' class="w-full border border-slate-300 rounded-md p-2 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2 pt-1">
                    <button id="btn-import-merge" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-2 rounded-md text-xs font-bold transition shadow-sm">
                        追加・統合して復元
                    </button>
                    <button id="btn-import-overwrite" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-md text-xs font-bold transition shadow-sm">
                        全上書きで復元
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white px-4 py-3 rounded-md shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm font-bold">
        メッセージ
    </div>

    <script>
        // 状態管理
        const state = {
            entries: [], // 全データ
            viewDate: new Date(2026, 8, 22), // カレンダー表示用の月（デフォルトは設定日基準）
            selectedDate: new Date(2026, 8, 22), // 選択されている日付
            editingEntryId: null, // 再編集中のログID
            entryToDeleteId: null,
            
            // 録音関連
            audioContext: null,
            analyser: null,
            mediaRecorder: null,
            audioChunks: [],
            recordedAudioUrl: null,
            recording: false,
            recordingSeconds: 0,
            timerInterval: null,
            visualizerAnimationFrame: null,
            speechRecognition: null
        };

        // DOM要素
        const elements = {
            calMonthYear: document.getElementById('cal-month-year'),
            calGrid: document.getElementById('calendar-grid'),
            calPrev: document.getElementById('cal-prev'),
            calNext: document.getElementById('cal-next'),
            btnToday: document.getElementById('btn-today'),
            
            timelineTitle: document.getElementById('timeline-date-title'),
            timelineContainer: document.getElementById('timeline-container'),
            
            recorderCard: document.getElementById('recorder-card'),
            recorderTitle: document.getElementById('recorder-title'),
            btnOpenRecorder: document.getElementById('btn-open-recorder'),
            btnCloseRecorder: document.getElementById('btn-close-recorder'),
            
            entryTitle: document.getElementById('entry-title'),
            entryText: document.getElementById('entry-text'),
            
            btnRecordToggle: document.getElementById('btn-record-toggle'),
            recordBtnText: document.getElementById('record-btn-text'),
            recordingIndicator: document.getElementById('recording-indicator'),
            timerDisplay: document.getElementById('timer-display'),
            visualizer: document.getElementById('visualizer'),
            recordingStatus: document.getElementById('recording-status'),
            
            btnSaveEntry: document.getElementById('btn-save-entry'),
            totalRecordsCount: document.getElementById('total-records-count'),
            
            deleteModal: document.getElementById('delete-modal'),
            deleteModalContent: document.getElementById('delete-modal-content'),
            btnCancelDelete: document.getElementById('btn-cancel-delete'),
            btnConfirmDelete: document.getElementById('btn-confirm-delete'),
            
            // バックアップ関連 DOM
            backupModal: document.getElementById('backup-modal'),
            backupModalContent: document.getElementById('backup-modal-content'),
            btnOpenBackup: document.getElementById('btn-open-backup'),
            btnCloseBackup: document.getElementById('btn-close-backup'),
            btnExportFile: document.getElementById('btn-export-file'),
            btnCopyJson: document.getElementById('btn-copy-json'),
            backupFileInput: document.getElementById('backup-file-input'),
            importTextInput: document.getElementById('import-text-input'),
            btnImportMerge: document.getElementById('btn-import-merge'),
            btnImportOverwrite: document.getElementById('btn-import-overwrite'),

            toast: document.getElementById('toast')
        };

        // オーディオ再生状態
        let currentAudio = null;
        let currentPlayingId = null;

        // 初期化処理
        function init() {
            loadEntries();
            setupSpeechRecognition();
            setupEventListeners();
            
            // 2026/9/22を初期設定とする
            state.viewDate = new Date(2026, 8, 22);
            state.selectedDate = new Date(2026, 8, 22);
            
            renderCalendar();
            renderTimeline();
            updateTotalCount();
        }

        function loadEntries() {
            const saved = localStorage.getItem('coach_diary_entries');
            if (saved) {
                state.entries = JSON.parse(saved);
            } else {
                // 初期サンプルデータ（野球指導向け）
                state.entries = [
                    {
                        id: 'sample-1',
                        year: 2025, month: 8, day: 22, // 9/22
                        timestamp: new Date(2025, 8, 22, 16, 0).getTime(),
                        title: '秋季県大会 1回戦 vs北陵高校',
                        text: '結果: 4-2で勝利。\nエースの立ち上がりが不安定だったが、3回以降はスライダーが低めに決まり立ち直った。\n打線は相手の速球に力負けしないスイングができていた。次戦に向けてバント処理の確認が必要。',
                        audioUrl: null, duration: 0
                    },
                    {
                        id: 'sample-2',
                        year: 2024, month: 8, day: 22, // 9/22
                        timestamp: new Date(2024, 8, 22, 10, 0).getTime(),
                        title: '紅白戦・シート打撃',
                        text: '新チームでの初紅白戦。\nサインの伝達ミスが2回あった。キャッチャーからの指示出しをもっと徹底させること。\n1年生の〇〇のバッティングが非常に良い。',
                        audioUrl: null, duration: 0
                    }
                ];
                saveEntries();
            }
        }

        function saveEntries() {
            localStorage.setItem('coach_diary_entries', JSON.stringify(state.entries));
            updateTotalCount();
        }

        function updateTotalCount() {
            elements.totalRecordsCount.textContent = state.entries.length;
        }

        function showToast(message) {
            elements.toast.textContent = message;
            elements.toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                elements.toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function renderCalendar() {
            const year = state.viewDate.getFullYear();
            const month = state.viewDate.getMonth();
            
            elements.calMonthYear.textContent = `${year}年${month + 1}月`;
            elements.calGrid.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // 空白セル
            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                elements.calGrid.appendChild(emptyDiv);
            }

            // 今日の日付（デモ環境では2026/9/22を今日とみなす）
            const today = new Date(2026, 8, 22);
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'p-1 aspect-square flex flex-col items-center justify-center cursor-pointer rounded-md transition-colors text-sm relative border border-transparent';
                
                const span = document.createElement('span');
                span.textContent = day;
                span.className = 'w-6 h-6 flex items-center justify-center rounded-md';
                dayCell.appendChild(span);

                const currentCellDate = new Date(year, month, day);

                // 選択されている日付のハイライト
                if (state.selectedDate && 
                    state.selectedDate.getFullYear() === year && 
                    state.selectedDate.getMonth() === month && 
                    state.selectedDate.getDate() === day) {
                    dayCell.classList.add('bg-blue-50', 'border-blue-200');
                    span.classList.add('font-bold', 'text-blue-700');
                } else {
                    dayCell.classList.add('hover:bg-slate-100');
                    span.classList.add('text-slate-700');
                }

                // 「今日」のハイライト
                if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
                    span.classList.add('bg-slate-800', 'text-white');
                    span.classList.remove('text-blue-700', 'text-slate-700');
                }

                // エントリーが存在する日（過去年含む同じ月日）のドット表示
                const hasEntries = state.entries.some(e => e.month === month && e.day === day);
                if (hasEntries) {
                    const dot = document.createElement('div');
                    dot.className = 'w-1 h-1 bg-blue-500 rounded-full mt-0.5 absolute bottom-1';
                    dayCell.appendChild(dot);
                }

                dayCell.addEventListener('click', () => {
                    state.selectedDate = new Date(year, month, day);
                    renderCalendar(); // 再描画してハイライト更新
                    renderTimeline();
                    
                    // フォームが開いていたら閉じるか、選択日付で更新する
                    if (!elements.recorderCard.classList.contains('hidden')) {
                        resetForm();
                        setupFormForSelectedDate();
                    }
                });

                elements.calGrid.appendChild(dayCell);
            }
        }

        function renderTimeline() {
            if (!state.selectedDate) return;

            const targetMonth = state.selectedDate.getMonth();
            const targetDay = state.selectedDate.getDate();
            const currentYear = state.selectedDate.getFullYear();

            elements.timelineTitle.textContent = `${targetMonth + 1}月${targetDay}日の記録`;
            elements.timelineContainer.innerHTML = '';

            // 対象の月日の記録を抽出し、年が新しい順にソート
            const dayEntries = state.entries
                .filter(e => e.month === targetMonth && e.day === targetDay)
                .sort((a, b) => b.year - a.year);

            if (dayEntries.length === 0) {
                elements.timelineContainer.innerHTML = `
                    <div class="text-center py-10 bg-slate-50 border border-slate-200 rounded-md">
                        <svg class="w-10 h-10 text-slate-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        <p class="text-slate-500 font-medium text-sm">この日の指導記録はまだありません</p>
                    </div>`;

            dayEntries.forEach(entry => {
                const isCurrentYear = entry.year === currentYear;
                const yearDiff = currentYear - entry.year;
                let yearsLabel = isCurrentYear ? "今年" : `${yearDiff}年前`;

                const card = document.createElement('div');
                card.className = 'bg-white border border-slate-200 rounded-md shadow-sm overflow-hidden transition-all duration-200';
                
                // 左側に年のラインを引くデザイン

                card.className += ' ' + borderAccent;

                // テキストのエスケープ処理

                card.innerHTML = `
                    <!-- ヘッダー（折りたたみ時も常に表示される要約エリア） -->
                    <div class="p-3.5 cursor-pointer hover:bg-slate-50/80 transition flex items-start justify-between gap-3 card-header select-none">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-bold px-2 py-0.5 rounded ${isCurrentYear ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-600'}">
                                    ${entry.year}年 (${yearsLabel})
                                </span>
                                ${entry.audioUrl ? `
                                    <span class="inline-flex items-center gap-1 text-[11px] font-medium text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                                        音声あり
                                    </span>
                                ` : ''}
                            </div>
                            <h4 class="text-base font-bold text-slate-800 truncate">${safeTitle}</h4>
                            ${safeTextRaw ? `<p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed preview-text">${safeTextRaw}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2 pt-1 flex-shrink-0">
                            <svg class="chevron-icon w-5 h-5 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>

                    </div>

                    <!-- 詳細コンテンツ（折りたたみ領域：デフォルトで非表示） -->
                    <div class="card-detail hidden border-t border-slate-100 bg-slate-50/50 p-4 space-y-3">

                                <div class="text-sm text-slate-700 leading-relaxed bg-white p-3 rounded-md border border-slate-200">${safeTextFormatted}</div>
                            </div>

                        ${entry.audioUrl ? `
                            <div>
                                <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">録音データ (${formatTime(entry.duration)})</span>
                                <div class="flex items-center gap-3 bg-white border border-slate-200 px-3 py-2 rounded-md w-max shadow-sm">
                                    <button class="btn-play-audio w-8 h-8 flex justify-center items-center rounded-full bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">
                                        <svg class="icon-play w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                                        <svg class="icon-pause w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                                    </button>
                                    <div class="w-36 bg-slate-200 h-2 rounded-full overflow-hidden">
                                        <div class="audio-progress bg-blue-600 h-full w-0 transition-all duration-100"></div>

                        ` : ''}

                        <!-- アクションボタンエリア -->
                        <div class="flex justify-end items-center gap-2 pt-2 border-t border-slate-200/60">

                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>

                const detail = card.querySelector('.card-detail');
                const chevron = card.querySelector('.chevron-icon');
                const previewText = card.querySelector('.preview-text');

                header.addEventListener('click', () => {
                    const isHidden = detail.classList.contains('hidden');
                    if (isHidden) {
                        detail.classList.remove('hidden');
                        chevron.classList.add('rotate-180');
                        if (previewText) previewText.classList.add('hidden');
                    } else {
                        detail.classList.add('hidden');
                        chevron.classList.remove('rotate-180');
                        if (previewText) previewText.classList.remove('hidden');
                    }
                });

                // イベントリスナー登録 (操作時にカードの開閉が連動しないよう stopPropagation)
                const deleteBtn = card.querySelector('.btn-delete-entry');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showDeleteModal(entry.id);
                });

                const editBtn = card.querySelector('.btn-edit-entry');
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditForm(entry);
                });

                const playBtn = card.querySelector('.btn-play-audio');
                if (playBtn) {
                    const progressBar = card.querySelector('.audio-progress');
                    playBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        playAudio(entry, playBtn, progressBar);
                    });
                }

                elements.timelineContainer.appendChild(card);
            });
        }

        function setupFormForSelectedDate() {
            const year = state.selectedDate.getFullYear();
            const month = state.selectedDate.getMonth() + 1;
            const day = state.selectedDate.getDate();
            elements.recorderTitle.innerHTML = `
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                新規記録作成 (${year}年${month}月${day}日)
            `;
        }

        function openEditForm(entry) {
            state.editingEntryId = entry.id;
            
            elements.recorderTitle.innerHTML = `
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                記録を編集 (${entry.year}年${entry.month + 1}月${entry.day}日)
            `;
            
            elements.entryTitle.value = entry.title || '';
            elements.entryText.value = entry.text || '';
            state.recordedAudioUrl = entry.audioUrl || null;
            state.recordingSeconds = entry.duration || 0;
            
            if (state.recordedAudioUrl) {
                elements.recordingStatus.textContent = "※すでに音声が録音されています。上書きする場合は再度録音してください。";
                elements.timerDisplay.textContent = formatTime(state.recordingSeconds);
            } else {
                elements.recordingStatus.textContent = "マイクボタンを押して録音を開始（音声自動文字起こし対応）";
                elements.timerDisplay.textContent = "00:00";
            }

            elements.recorderCard.classList.remove('hidden');
            // スマホ等で画面外にいる場合にスクロール
            elements.recorderCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            state.editingEntryId = null;
            elements.entryTitle.value = '';
            elements.entryText.value = '';
            state.recordedAudioUrl = null;
            state.recordingSeconds = 0;
            elements.timerDisplay.textContent = '00:00';
            elements.recordingStatus.textContent = 'マイクボタンを押して録音を開始（音声自動文字起こし対応）';
            
            setupFormForSelectedDate();
            elements.recorderCard.classList.add('hidden');
        }

        function saveEntry() {
            const title = elements.entryTitle.value.trim();
            const text = elements.entryText.value.trim();
            
            if (!title) {
                showToast('概要・タイトルを入力してください。');
                elements.entryTitle.focus();
                return;
            }

            if (state.editingEntryId) {
                // 編集モード
                const targetIndex = state.entries.findIndex(e => e.id === state.editingEntryId);
                if (targetIndex !== -1) {
                    state.entries[targetIndex].title = title;
                    state.entries[targetIndex].text = text;
                    // 新しく録音していれば上書き、そうでなければ元のまま
                    if (state.recordingSeconds > 0 && state.recordedAudioUrl) {
                         state.entries[targetIndex].audioUrl = state.recordedAudioUrl;
                         state.entries[targetIndex].duration = state.recordingSeconds;
                    }
                    showToast('記録を更新しました。');
                }
            } else {
                // 新規追加モード
                const year = state.selectedDate.getFullYear();
                const month = state.selectedDate.getMonth();
                const day = state.selectedDate.getDate();

                const newEntry = {
                    id: 'entry-' + Date.now(),
                    year: year,
                    month: month,
                    day: day,
                    timestamp: Date.now(),
                    title: title,
                    text: text,
                    audioUrl: state.recordedAudioUrl,
                    duration: state.recordingSeconds || 0
                };

                // 同じ日付・年の記録があれば削除（上書き）
                state.entries = state.entries.filter(e => !(e.year === year && e.month === month && e.day === day));
                
                state.entries.push(newEntry);
                showToast(`${year}年${month + 1}月${day}日の記録を保存しました。`);
            }

            saveEntries();
            resetForm();
            renderCalendar();
            renderTimeline();
        }

        function showDeleteModal(id) {
            state.entryToDeleteId = id;
            elements.deleteModal.classList.remove('hidden');
            // アニメーションのため少し遅延
            requestAnimationFrame(() => {
                elements.deleteModal.classList.remove('opacity-0');
                elements.deleteModalContent.classList.remove('scale-95');
                elements.deleteModalContent.classList.add('scale-100');
            });
        }

        function hideDeleteModal() {
            state.entryToDeleteId = null;
            elements.deleteModal.classList.add('opacity-0');
            elements.deleteModalContent.classList.remove('scale-100');
            elements.deleteModalContent.classList.add('scale-95');
            
            setTimeout(() => {
                elements.deleteModal.classList.add('hidden');
            }, 200);
        }

        // バックアップモーダルの表示・非表示
        function showBackupModal() {
            elements.backupModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                elements.backupModal.classList.remove('opacity-0');
                elements.backupModalContent.classList.remove('scale-95');
                elements.backupModalContent.classList.add('scale-100');
            });
        }

        function hideBackupModal() {
            elements.backupModal.classList.add('opacity-0');
            elements.backupModalContent.classList.remove('scale-100');
            elements.backupModalContent.classList.add('scale-95');
            
            setTimeout(() => {
                elements.backupModal.classList.add('hidden');
                elements.importTextInput.value = '';
                elements.backupFileInput.value = '';
            }, 200);
        }

        // バックアップ書き出し（ファイル保存）
        function exportBackupFile() {
            const jsonStr = JSON.stringify(state.entries, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const todayStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
            const a = document.createElement('a');
            a.href = url;
            a.download = `指導記録バックアップ_${todayStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('バックアップファイルを保存しました');
        }

        // バックアップ書き出し（クリップボードコピー）
        function copyBackupText() {
            const jsonStr = JSON.stringify(state.entries, null, 2);
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = jsonStr;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            
            showToast('バックアップテキストをコピーしました');
        }

        // データインポート実行
        function processImport(isOverwrite) {
            const file = elements.backupFileInput.files[0];
            const text = elements.importTextInput.value.trim();

            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    executeImportData(e.target.result, isOverwrite);
                };
                reader.readAsText(file);
            } else if (text) {
                executeImportData(text, isOverwrite);
            } else {
                showToast('復元するファイルまたはテキストを指定してください');
            }
        }

        function executeImportData(jsonString, isOverwrite) {
            try {
                const parsed = JSON.parse(jsonString);
                if (!Array.isArray(parsed)) {
                    throw new Error('形式が正しくありません');
                }

                if (isOverwrite) {
                    state.entries = parsed;
                } else {
                    const existingIds = new Set(state.entries.map(e => e.id));
                    const newItems = parsed.filter(e => !existingIds.has(e.id));
                    state.entries = [...state.entries, ...newItems];
                }

                saveEntries();
                renderCalendar();
                renderTimeline();
                hideBackupModal();
                showToast(`データを復元しました（全${state.entries.length}件）`);
            } catch (err) {
                console.error(err);
                showToast('データの読み込みに失敗しました。正しいバックアップデータか確認してください。');
            }
        }

        function executeDelete() {
            if (state.entryToDeleteId) {
                state.entries = state.entries.filter(e => e.id !== state.entryToDeleteId);
                saveEntries();
                hideDeleteModal();
                renderCalendar();
                renderTimeline();
                showToast('記録を削除しました。');
            }
        }

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                state.speechRecognition = new SpeechRecognition();
                state.speechRecognition.lang = 'ja-JP';
                state.speechRecognition.continuous = true;
                state.speechRecognition.interimResults = true;

                state.speechRecognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    if (finalTranscript) {
                        // 既存のテキストの末尾に追加
                        const currentText = elements.entryText.value;
                        elements.entryText.value = currentText ? currentText + '\n' + finalTranscript : finalTranscript;
                    }
                };
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                state.analyser = state.audioContext.createAnalyser();
                const source = state.audioContext.createMediaStreamSource(stream);
                source.connect(state.analyser);
                state.analyser.fftSize = 256;

                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];

                state.mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) state.audioChunks.push(e.data);
                };

                state.mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                    state.recordedAudioUrl = URL.createObjectURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                state.mediaRecorder.start();
                if (state.speechRecognition) state.speechRecognition.start();

                state.recording = true;
                state.recordingSeconds = 0;
                elements.recordingIndicator.classList.remove('hidden');
                elements.recordBtnText.textContent = "録音停止";
                elements.btnRecordToggle.classList.replace('bg-slate-200', 'bg-red-100');
                elements.btnRecordToggle.classList.replace('text-slate-700', 'text-red-700');
                
                elements.visualizer.classList.remove('hidden');
                elements.recordingStatus.textContent = "録音中... (話した内容がテキスト欄に追加されます)";
                
                state.timerInterval = setInterval(() => {
                    state.recordingSeconds++;
                    elements.timerDisplay.textContent = formatTime(state.recordingSeconds);
                }, 1000);

                drawVisualizer();

            } catch (err) {
                console.error("マイクのアクセスエラー:", err);
                showToast('マイクへのアクセスが拒否されたか、利用できません。');
            }
        }

        function stopRecording() {
            if (!state.recording) return;

            state.mediaRecorder.stop();
            if (state.speechRecognition) state.speechRecognition.stop();
            
            clearInterval(state.timerInterval);
            cancelAnimationFrame(state.visualizerAnimationFrame);
            
            state.recording = false;
            elements.recordingIndicator.classList.add('hidden');
            elements.recordBtnText.textContent = "再録音する";
            elements.btnRecordToggle.classList.replace('bg-red-100', 'bg-slate-200');
            elements.btnRecordToggle.classList.replace('text-red-700', 'text-slate-700');
            
            elements.visualizer.classList.add('hidden');
            elements.recordingStatus.textContent = "録音が完了しました。";
        }

        function drawVisualizer() {
            if (!state.recording) return;
            
            const canvas = elements.visualizer;
            const ctx = canvas.getContext('2d');
            const bufferLength = state.analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            state.analyser.getByteFrequencyData(dataArray);
            
            ctx.fillStyle = '#0f172a'; // bg-slate-900
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;
            
            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 4;
                ctx.fillStyle = '#3b82f6'; // blue-500
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
            
            state.visualizerAnimationFrame = requestAnimationFrame(drawVisualizer);
        }

        // オーディオ再生処理
        function playAudio(entry, playBtn, progressBar) {
            const iconPlay = playBtn.querySelector('.icon-play');
            const iconPause = playBtn.querySelector('.icon-pause');

            if (currentAudio) {
                currentAudio.pause();
                if (currentPlayingId === entry.id) {
                    currentAudio = null;
                    currentPlayingId = null;
                    iconPlay.classList.remove('hidden');
                    iconPause.classList.add('hidden');
                    if (progressBar) progressBar.style.width = '0%';
                    return;
                }
            }

            document.querySelectorAll('.icon-play').forEach(i => i.classList.remove('hidden'));
            document.querySelectorAll('.icon-pause').forEach(i => i.classList.add('hidden'));

            currentAudio = new Audio(entry.audioUrl);
            currentPlayingId = entry.id;

            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');

            currentAudio.play();

            currentAudio.ontimeupdate = () => {
                if (currentAudio && progressBar && currentAudio.duration) {
                    const pct = (currentAudio.currentTime / currentAudio.duration) * 100;
                    progressBar.style.width = `${pct}%`;
                }
            };

            currentAudio.onended = () => {
                if (progressBar) progressBar.style.width = '0%';
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                currentAudio = null;
                currentPlayingId = null;
            };
        }

        function setupEventListeners() {
            // カレンダー操作
            elements.calPrev.addEventListener('click', () => {
                state.viewDate.setMonth(state.viewDate.getMonth() - 1);
                renderCalendar();
            });
            elements.calNext.addEventListener('click', () => {
                state.viewDate.setMonth(state.viewDate.getMonth() + 1);
                renderCalendar();
            });
            elements.btnToday.addEventListener('click', () => {
                state.viewDate = new Date(2026, 8, 22); // デモ基準日
                state.selectedDate = new Date(2026, 8, 22);
                renderCalendar();
                renderTimeline();
                if(!elements.recorderCard.classList.contains('hidden')) resetForm();
            });

            // フォーム操作
            elements.btnOpenRecorder.addEventListener('click', () => {
                resetForm();
                elements.recorderCard.classList.remove('hidden');
                elements.recorderCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            elements.btnCloseRecorder.addEventListener('click', () => {
                if (state.recording) stopRecording();
                resetForm();
            });
            elements.btnSaveEntry.addEventListener('click', saveEntry);

            // 録音操作
            elements.btnRecordToggle.addEventListener('click', () => {
                if (!state.recording) startRecording();
                else stopRecording();
            });

            // 削除モーダル
            elements.btnCancelDelete.addEventListener('click', hideDeleteModal);
            elements.btnConfirmDelete.addEventListener('click', executeDelete);

            // バックアップモーダル
            elements.btnOpenBackup.addEventListener('click', showBackupModal);
            elements.btnCloseBackup.addEventListener('click', hideBackupModal);
            elements.btnExportFile.addEventListener('click', exportBackupFile);
            elements.btnCopyJson.addEventListener('click', copyBackupText);
            elements.btnImportMerge.addEventListener('click', () => processImport(false));
            elements.btnImportOverwrite.addEventListener('click', () => processImport(true));
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(match) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[match];
            });
        }

        // キャンバスのリサイズ対応
        window.addEventListener('resize', () => {
            if (elements.visualizer) {
                elements.visualizer.width = elements.visualizer.parentElement.clientWidth;
                elements.visualizer.height = 60;
            }
        });

        // 起動
        window.onload = () => {
            elements.visualizer.width = elements.visualizer.parentElement.clientWidth;
            elements.visualizer.height = 60;
            init();
        };
    </script>
</body>
</html>
